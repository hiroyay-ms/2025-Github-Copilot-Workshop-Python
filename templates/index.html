<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>ポモドーロタイマー</h1>
            <button id="settings-btn" class="btn-settings" aria-label="設定を開く">⚙️</button>
        </header>
        
        <main>
            <div class="timer-section">
                <p id="status-text" class="status-text">停止中</p>
                
                <div class="timer-display">
                    <!-- 円形プログレスバー -->
                    <svg class="progress-ring" width="300" height="300">
                        <circle class="progress-ring__background"
                                stroke="#e0e0e0"
                                stroke-width="12"
                                fill="transparent"
                                r="140"
                                cx="150"
                                cy="150"/>
                        <circle id="progress-ring__circle"
                                class="progress-ring__circle"
                                stroke="#5B68E8"
                                stroke-width="12"
                                fill="transparent"
                                r="140"
                                cx="150"
                                cy="150"
                                stroke-dasharray="879.65 879.65"
                                stroke-dashoffset="0"
                                transform="rotate(-90 150 150)"/>
                    </svg>
                    <span id="timer-display" class="time">25:00</span>
                </div>
                
                <div class="controls">
                    <button id="start-btn" class="btn-start">開始</button>
                    <button id="reset-btn" class="btn-reset">リセット</button>
                </div>
            </div>
            
            <div class="stats-section">
                <h2>今日の進捗</h2>
                <div class="stats">
                    <div class="stat-item">
                        <span id="completed-count" class="stat-value">0</span>
                        <span class="stat-label">完了</span>
                    </div>
                    <div class="stat-item">
                        <span id="focus-time" class="stat-value">0分</span>
                        <span class="stat-label">集中時間</span>
                    </div>
                </div>
            </div>
            
            <!-- Gamification Section -->
            <div class="gamification-section">
                <h2>プロフィール</h2>
                <div class="profile-card">
                    <div class="level-display">
                        <span class="level-label">レベル</span>
                        <span id="user-level" class="level-value">1</span>
                    </div>
                    <div class="xp-display">
                        <div class="xp-bar-container">
                            <div id="xp-bar" class="xp-bar" style="width: 0%"></div>
                        </div>
                        <span id="xp-text" class="xp-text">0 / 100 XP</span>
                    </div>
                    <div class="streak-display">
                        <span class="streak-icon">🔥</span>
                        <span id="streak-count" class="streak-count">0</span>
                        <span class="streak-label">日連続</span>
                    </div>
                </div>
                
                <h2>バッジ</h2>
                <div id="badges-container" class="badges-container">
                    <!-- Badges will be dynamically inserted here -->
                </div>
                
                <h2>統計</h2>
                <div class="stats-tabs">
                    <button id="tab-weekly" class="stats-tab active">週間</button>
                    <button id="tab-monthly" class="stats-tab">月間</button>
                </div>
                <div id="stats-display" class="stats-display">
                    <div class="stat-row">
                        <span class="stat-label-lg">完了セッション</span>
                        <span id="period-completed" class="stat-value-lg">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label-lg">集中時間</span>
                        <span id="period-focus-time" class="stat-value-lg">0分</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- Settings Modal -->
    <div id="settings-modal" class="modal" role="dialog" aria-labelledby="settings-title" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="settings-title">設定</h2>
                <button id="close-settings-btn" class="btn-close" aria-label="閉じる">×</button>
            </div>
            
            <div class="modal-body">
                <!-- Time Settings -->
                <div class="settings-group">
                    <h3>時間設定</h3>
                    
                    <div class="setting-item">
                        <label for="work-duration">作業時間</label>
                        <select id="work-duration" class="select-input">
                            <option value="15">15分</option>
                            <option value="25" selected>25分</option>
                            <option value="35">35分</option>
                            <option value="45">45分</option>
                        </select>
                    </div>
                    
                    <div class="setting-item">
                        <label for="break-duration">休憩時間</label>
                        <select id="break-duration" class="select-input">
                            <option value="5" selected>5分</option>
                            <option value="10">10分</option>
                            <option value="15">15分</option>
                        </select>
                    </div>
                </div>
                
                <!-- Theme Settings -->
                <div class="settings-group">
                    <h3>テーマ</h3>
                    
                    <div class="setting-item radio-group">
                        <label>
                            <input type="radio" name="theme" value="light" checked>
                            <span class="radio-label">ライト</span>
                        </label>
                        <label>
                            <input type="radio" name="theme" value="dark">
                            <span class="radio-label">ダーク</span>
                        </label>
                        <label>
                            <input type="radio" name="theme" value="focus">
                            <span class="radio-label">フォーカス</span>
                        </label>
                    </div>
                </div>
                
                <!-- Sound Settings -->
                <div class="settings-group">
                    <h3>サウンド設定</h3>
                    
                    <div class="setting-item">
                        <label for="sound-start">
                            <input type="checkbox" id="sound-start" checked>
                            開始音
                        </label>
                    </div>
                    
                    <div class="setting-item">
                        <label for="sound-end">
                            <input type="checkbox" id="sound-end" checked>
                            終了音
                        </label>
                    </div>
                    
                    <div class="setting-item">
                        <label for="sound-tick">
                            <input type="checkbox" id="sound-tick">
                            tick音
                        </label>
                    </div>
                </div>
            </div>
            
            <div class="modal-footer">
                <button id="cancel-settings-btn" class="btn-cancel">キャンセル</button>
                <button id="save-settings-btn" class="btn-save">保存</button>
            </div>
        </div>
    </div>
    
    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/settings-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui-controller.js') }}"></script>
    <script src="{{ url_for('static', filename='js/gamification-controller.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
