<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>ポモドーロタイマー</h1>
        </header>
        
        <main>
            <div class="timer-section">
                <p id="status-text" class="status-text">停止中</p>
                
                <div class="timer-display">
                    <!-- 円形プログレスバー -->
                    <svg class="progress-ring" width="300" height="300">
                        <circle class="progress-ring__background"
                                stroke="#e0e0e0"
                                stroke-width="8"
                                fill="transparent"
                                r="140"
                                cx="150"
                                cy="150"/>
                        <circle id="progress-ring__circle"
                                class="progress-ring__circle"
                                stroke="#5B68E8"
                                stroke-width="8"
                                fill="transparent"
                                r="140"
                                cx="150"
                                cy="150"
                                stroke-dasharray="879.65 879.65"
                                stroke-dashoffset="0"
                                transform="rotate(-90 150 150)"/>
                    </svg>
                    <span id="timer-display" class="time">25:00</span>
                </div>
                
                <div class="controls">
                    <button id="start-btn" class="btn-start">開始</button>
                    <button id="reset-btn" class="btn-reset">リセット</button>
                </div>
            </div>
            
            <div class="stats-section">
                <h2>今日の進捗</h2>
                <div class="stats">
                    <div class="stat-item">
                        <span id="completed-count" class="stat-value">0</span>
                        <span class="stat-label">完了</span>
                    </div>
                    <div class="stat-item">
                        <span id="focus-time" class="stat-value">0分</span>
                        <span class="stat-label">集中時間</span>
                    </div>
                </div>
            </div>
            
            <!-- Gamification Section -->
            <div class="gamification-section">
                <h2>プロフィール</h2>
                <div class="profile-card">
                    <div class="level-display">
                        <span class="level-label">レベル</span>
                        <span id="user-level" class="level-value">1</span>
                    </div>
                    <div class="xp-display">
                        <div class="xp-bar-container">
                            <div id="xp-bar" class="xp-bar" style="width: 0%"></div>
                        </div>
                        <span id="xp-text" class="xp-text">0 / 100 XP</span>
                    </div>
                    <div class="streak-display">
                        <span class="streak-icon">🔥</span>
                        <span id="streak-count" class="streak-count">0</span>
                        <span class="streak-label">日連続</span>
                    </div>
                </div>
                
                <h2>バッジ</h2>
                <div id="badges-container" class="badges-container">
                    <!-- Badges will be dynamically inserted here -->
                </div>
                
                <h2>統計</h2>
                <div class="stats-tabs">
                    <button id="tab-weekly" class="stats-tab active">週間</button>
                    <button id="tab-monthly" class="stats-tab">月間</button>
                </div>
                <div id="stats-display" class="stats-display">
                    <div class="stat-row">
                        <span class="stat-label-lg">完了セッション</span>
                        <span id="period-completed" class="stat-value-lg">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label-lg">集中時間</span>
                        <span id="period-focus-time" class="stat-value-lg">0分</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/timer.js') }}"></script>
    <script src="{{ url_for('static', filename='js/api-client.js') }}"></script>
    <script src="{{ url_for('static', filename='js/ui-controller.js') }}"></script>
    <script src="{{ url_for('static', filename='js/gamification-controller.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
